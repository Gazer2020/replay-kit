experiment_name: officehome_resnet50_3seed

system:
  shutdown_on_finish: true
  shutdown_command:
    - shutdown
    - -h
    - now

noise_warmup_da:
  dataset: officehome
  data_root: data
  domains:
    - Art
    - Clipart
    - Product
    - Real World
  seeds:
    - 7
    - 13
    - 21
  image_size: 224
  test_fraction: 0.2
  num_classes: 65
  model: resnet50
  pretrained_weights: true
  batch_size: 64
  num_workers: 8
  epochs: 20
  warmup_epochs: 5
  noise_steps_per_epoch: null
  lr: 0.0001
  warmup_lr: 0.0001
  weight_decay: 0.0001
  amp: true
  ece_bins: 15
  save_checkpoints: false
